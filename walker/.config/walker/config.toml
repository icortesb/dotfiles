force_keyboard_focus = true   # keep keyboard focus inside Walker
selection_wrap = true         # wrap list at top/bottom
theme = "tokyonight"          # ~/.config/walker/themes/tokyonight

[placeholders]
"default" = { input = "  Buscar…", list = "Sin resultados" }

[columns]
"symbols" = 4

[providers]
default = ["desktopapplications", "calc", "websearch"]
empty = ["desktopapplications"]
max_results = 50

# Prefijos: se reemplaza la lista por defecto entera.
[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = ":"
provider = "symbols"

[[providers.prefixes]]
prefix = "$"
provider = "clipboard"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = ">"
provider = "runner"

[[providers.prefixes]]
prefix = ";"
provider = "providerlist"
