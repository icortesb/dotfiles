# ─────────────────────────────────────────────────────────────
#  kitty — Tokyo Night / multiplexor
#  Este archivo es hardlink con ~/.dotfiles/kitty/.config/kitty/
#  Editar con `cat >` o un editor in-place; `mv` rompe el enlace.
# ─────────────────────────────────────────────────────────────

include color.ini

# ─── Fuente ───────────────────────────────────────────────────
font_family              JetBrainsMono Nerd Font Mono
font_size                13
disable_ligatures        never
text_composition_strategy platform
adjust_line_height       0
adjust_column_width      0
adjust_baseline          0

# ─── Cursor ───────────────────────────────────────────────────
cursor_shape             beam
cursor_beam_thickness    1.8
cursor_blink_interval    0
cursor_trail             3

# ─── Ventanas y splits ────────────────────────────────────────
# alt+l cicla SOLO estos tres layouts (antes ciclaba los 7 de kitty).
enabled_layouts          splits:split_axis=vertical,tall,stack

window_border_width      2px
draw_minimal_borders     no
window_margin_width      2
single_window_margin_width 0
window_padding_width     10

active_border_color      #88c0d0
inactive_border_color    #3b4252

# El atenuado del split sin foco lo hace split-dim.py (fondo real,
# igual que decoration.inactive_opacity = 0.85 de Hyprland).
# inactive_text_alpha queda en 1.0 para no atenuar dos veces.
watcher                  split-dim.py
inactive_text_alpha      1.0

# La transparencia de ventana la maneja Hyprland, no kitty.
background_opacity       1.0

resize_debounce_time     0.01

# ─── Tab bar ──────────────────────────────────────────────────
tab_bar_edge             bottom
tab_bar_style            powerline
tab_powerline_style      slanted
tab_bar_min_tabs         1
tab_title_max_length     20
tab_activity_symbol      *

active_tab_background    #88c0d0
active_tab_foreground    #2e3440
active_tab_font_style    bold
inactive_tab_background  #3b4252
inactive_tab_foreground  #81a1c1
inactive_tab_font_style  normal
tab_bar_margin_color     #2e3440

tab_title_template        "{index} {title}"
active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{layout_name} · {title}"

# ─── Keybinds: splits ─────────────────────────────────────────
map alt+enter        launch --location=vsplit --cwd=current
map alt+shift+enter  launch --location=hsplit --cwd=current
map alt+q            new_window_with_cwd
map alt+c            close_window
map alt+l            next_layout

map alt+left         neighboring_window left
map alt+right        neighboring_window right
map alt+up           neighboring_window up
map alt+down         neighboring_window down

map alt+shift+left   move_window left
map alt+shift+right  move_window right
map alt+shift+up     move_window up
map alt+shift+down   move_window down

map ctrl+alt+a       goto_layout tall
map ctrl+alt+z       goto_layout stack

# ─── Keybinds: varios ─────────────────────────────────────────
map f5 copy_to_buffer a
map f6 paste_to_buffer a
map f7 copy_to_buffer b
map f8 paste_to_buffer b

map ctrl+shift+e     open_url_with_hints
map ctrl+shift+u     kitten unicode_input
map ctrl+shift+up    scroll_to_prompt -1
map ctrl+shift+down  scroll_to_prompt 1
map ctrl+shift+h     no_op

# ─── URLs ─────────────────────────────────────────────────────
url_color                #88c0d0
url_style                curly
detect_urls              yes
allow_hyperlinks         yes

# ─── Shell / clipboard ────────────────────────────────────────
shell                    zsh
shell_integration        enabled
copy_on_select           yes
strip_trailing_spaces    always
clipboard_control        write-clipboard write-primary read-clipboard read-primary

# ─── Scrollback ───────────────────────────────────────────────
scrollback_lines             10000
scrollback_pager_history_size 10

# ─── Campana ──────────────────────────────────────────────────
# (antes decia `enabled_audio_bell`, que no es una opcion valida:
#  la campana sonaba igual)
enable_audio_bell        no
visual_bell_duration     0.0
window_alert_on_bell     no

# ─── Misc ─────────────────────────────────────────────────────
mouse_hide_wait          3.0
repaint_delay            10
input_delay              3
sync_to_monitor          yes
confirm_os_window_close  0
