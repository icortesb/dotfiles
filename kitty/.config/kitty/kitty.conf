enabled_audio_bell no

include color.ini

font_family       CaskaydiaCove Nerd Font Mono
font_size 13

disable_ligatures never

url_color #61afef

url_style curly

map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

map f5 copy_to_buffer a
map f6 paste_to_buffer a
map f7 copy_to_buffer b 
map f8 paste_to_buffer b

cursor_shape beam
cursor_beam_thickness 1.8

mouse_hide_wait 3.0
detect_urls yes

repaint_delay 10
input_delay 3
sync_to_monitor yes

map ctrl+alt+a goto_layout tall
map ctrl+alt+z goto_layout stack



tab_bar_style powerline

inactive_tab_background #204146
active_tab_background #8c58ab
inactive_tab_foreground #FFFFFF
active_tab_foreground #FFFFFF
tab_bar_margin_color black

map alt+q new_window_with_cwd
map alt+c close_window
map alt+l next_layout

# Window styling
window_border_width 1pt
draw_minimal_borders yes
window_margin_width 0
single_window_margin_width -1

# Window titles
tab_bar_min_tabs 1
tab_bar_edge bottom
tab_title_template "{index}: {title}"

# Border colors - subtle to match your clean aesthetic
active_border_color #ffffff
inactive_border_color #404040

# Opacity
inactive_text_alpha 0.85

background_opacity 0.50

export TERM=xterm-256color

shell zsh

cursor_trail 3
confirm_exit no
confirm_os_window_close 0
strip_trailing_spaces always

# Smart copy/paste
copy_on_select yes

# URL hints - keyboard-driven URL opening
map ctrl+shift+e open_url_with_hints

# Unicode input
map ctrl+shift+u kitten unicode_input

# Performance and scrollback
scrollback_lines 10000
scrollback_pager_history_size 10

# Hyperlink support
allow_hyperlinks yes

# Bell settings
visual_bell_duration 0.0
window_alert_on_bell no

# Animaciones y transiciones
window_resize_draw_strategy static
resize_debounce_time 0.01

# Efectos de cursor avanzados
cursor_blink_interval 0
cursor_stop_blinking_after 15.0

# Indicador de actividad en tabs
tab_activity_symbol *
tab_title_max_length 20

# Active tab con símbolos
active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"

# Mejor renderizado de fuentes
text_composition_strategy platform

# Espaciado de líneas
adjust_line_height 0
adjust_column_width 0
adjust_baseline 0

# Powerline slanted style
tab_powerline_style slanted

# Shell integration
shell_integration enabled

# Clipboard persistente entre ventanas
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Navegación entre prompts
map ctrl+shift+up scroll_to_prompt -1
map ctrl+shift+down scroll_to_prompt 1

# Deshabilitar scrollback search
map ctrl+shift+h no_op
